<!DOCTYPE html>
<html>
<head>
    <title>Product card</title>
</head>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div id="parent">
        <div id="left">
        <img class="img" src="download.png  " alt="black sheet"></div>
        <div id="right">
     <h3 class="heading">SOUND MAX <i class="fa-solid fa-headphones"></i> </h3>
     <h4 class="heading">PREMIUM COLLECTION</h4>
    <p class="para">Wireless headphones</p>
     <h3 class="heading"> PRICE $6000 <del>$8000</del></h3>
    <ul id="li">
      <li>Bluetooth</li>
      <li>Wireless</li>
      <li>comfort</li></ul>
    <div class="color">
     <p id="headings">COLOURS</p>
    <p class="white"></p>
    <p class="beige"></p>
    <p class="grey"></p>
</div>
<button id="button"><i class="fa-solid fa-cart-plus"></i>Add to cart</button>
        </div>
    </div>
</body>
</html>
